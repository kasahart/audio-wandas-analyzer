[project]
name = "audio-wandas-analyzer-backend"
version = "0.0.0"
description = "Python backend for the audio-wandas-analyzer VS Code extension."
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0.2",
    "scipy>=1.13",
    "wandas[psychoacoustic,effects]>=0.10.0,<0.11.0",
    "soundfile>=0.12",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "jsonschema>=4.18",
    # A recipe bundle's run_recipe.py saves its outputs as WDF (wandas[io]); its end-to-end test needs it.
    "h5netcdf[h5py]>=1.6.4",
]

[tool.setuptools]
# The backend is run as scripts under python-backend/; no importable package is shipped.
py-modules = []

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["python-backend"]
extend-exclude = [".venv", "dist", "node_modules", ".vscode-test", ".worktrees"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["python-backend"]
python_files = "test_*.py"
addopts = "-q"
