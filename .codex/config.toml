# Project-local Codex configuration. Codex loads this file only after the
# repository is trusted.

[[hooks.PreToolUse]]
matcher = "Edit|Write|^apply_patch$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = 'python3 "$(git rev-parse --show-toplevel)/.codex/hooks/check_worktree_edit.py"'
timeout = 10
statusMessage = "Checking worktree isolation"
