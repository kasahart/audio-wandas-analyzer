name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  # Every CI job (verify on each OS, UI smoke, VS Code E2E, browser parity) on the tagged commit.
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    name: Build VSIX and publish
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Validate tag matches package version
        run: |
          tag="${GITHUB_REF_NAME}"
          pkg_version="$(node -p "require('./package.json').version")"
          expected_tag="v${pkg_version}"
          if [ "$tag" != "$expected_tag" ]; then
            echo "Tag $tag does not match package.json version $pkg_version (expected $expected_tag)." >&2
            exit 1
          fi

      - name: Build VSIX
        run: npm run package:vsix

      - name: Locate VSIX
        id: vsix
        run: |
          file=$(ls -1 *.vsix | head -n 1)
          echo "path=$file" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.vsix.outputs.path }}
          generate_release_notes: true

      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx --no-install vsce publish --no-yarn --packagePath "${{ steps.vsix.outputs.path }}"
