name: CI

on:
  push:
    branches: [main]
  pull_request:
  # release.yml runs these jobs on the tagged commit before it publishes.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      # The operation catalog's probe (minutes) runs once, on Linux; its result does not depend on the OS.
      AWA_SLOW: ${{ matrix.os == 'ubuntu-latest' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            python-backend/constraints.txt
            pyproject.toml

      - name: Install Linux runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsndfile1

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dev dependencies
        run: pip install -c python-backend/constraints.txt -e ".[dev]"

      - name: Run verify
        run: npm run verify

      - name: Audit authored runtime source sharing
        if: runner.os == 'Linux'
        run: python scripts/audit-runtime-sharing.py --output test-results/runtime-sharing.json

      - name: Upload runtime source audit
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: runtime-sharing-audit
          path: test-results/runtime-sharing.json

  test-ui:
    name: test:ui (Playwright Chromium smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Restore Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        run: npm run test:ui:install

      - name: Run UI smoke
        run: npm run test:ui

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/

  e2e:
    name: e2e (VS Code extension host)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            python-backend/constraints.txt
            pyproject.toml

      - name: Install Linux + xvfb dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2t64 \
            libatk-bridge2.0-0 \
            libatk1.0-0 \
            libcups2 \
            libdrm2 \
            libgbm1 \
            libgtk-3-0 \
            libnspr4 \
            libnss3 \
            libsndfile1 \
            libxrandr2 \
            libxshmfence1 \
            libxss1 \
            xauth \
            xdotool \
            xvfb

      - name: Install Node dependencies
        run: npm ci

      - name: Create workspace venv (E2E expects .venv/bin/python)
        run: |
          python -m venv .venv
          ./.venv/bin/pip install --upgrade pip
          ./.venv/bin/pip install -c python-backend/constraints.txt -e ".[dev]"

      - name: Restore the pinned VS Code download
        uses: actions/cache@v5
        with:
          path: .vscode-test
          # runnerHelpers.ts pins the VS Code version; the E2E user data lives in a temporary directory.
          key: vscode-test-${{ runner.os }}-${{ hashFiles('src/e2e/runnerHelpers.ts') }}

      - name: Run E2E
        run: npm run verify:e2e

  browser-parity:
    name: Static Worker/native parity (headless)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            python-backend/constraints.txt
            pyproject.toml
      - run: npm ci
      - run: python3 -m venv .venv && .venv/bin/pip install -c python-backend/constraints.txt -e ".[dev]"
      - name: Restore Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm run test:ui:install
      - name: Restore hash-locked browser runtime downloads
        uses: actions/cache@v5
        with:
          path: browser-dist/runtime
          # Exact key only: a partial restore could publish assets the lock no longer lists.
          key: browser-runtime-${{ hashFiles('runtime/lock.json', 'runtime/licenses/**', 'scripts/prepare-browser-runtime.py') }}
      - run: npm run prepare:browser
      # Only the browser-specific half of `AWA_VERIFY_BROWSER=1 npm run verify`; the verify job runs the rest.
      - run: python3 scripts/prepare-browser-runtime.py --check
      - run: npm run test:browser
