name: CI

on:
  push:
    branches: [main]
  pull_request:
  # release.yml runs these jobs on the tagged commit before it publishes.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      # The operation catalog's probe (minutes) runs once, on Linux; its result does not depend on the OS.
      AWA_SLOW: ${{ matrix.os == 'ubuntu-latest' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            python-backend/constraints.txt
            pyproject.toml

      - name: Install Linux runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsndfile1

      - name: Install Node dependencies
        run: npm ci

      # A workspace venv, as a user's checkout has: verify, and the tests that run the backend's Python, find it the way
      # the extension does (.venv\Scripts\python.exe on Windows, .venv/bin/python elsewhere). In CI a test that skips
      # for want of it fails verify (scripts/test-skips.mjs).
      - name: Create workspace venv with the Python dev dependencies
        shell: bash
        run: |
          python -m venv .venv
          venv_python=.venv/${{ runner.os == 'Windows' && 'Scripts' || 'bin' }}/python
          "$venv_python" -m pip install --upgrade pip
          "$venv_python" -m pip install -c python-backend/constraints.txt -e ".[dev]"

      - name: Run verify
        run: npm run verify

      - name: Audit authored runtime source sharing
        if: runner.os == 'Linux'
        run: python scripts/audit-runtime-sharing.py --output test-results/runtime-sharing.json

      - name: Upload runtime source audit
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: runtime-sharing-audit
          path: test-results/runtime-sharing.json

  test-ui:
    name: test:ui (Playwright Chromium smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # The plot contract and entry tests scan their fixture with the Python backend; without it they would skip.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            python-backend/constraints.txt
            pyproject.toml

      - name: Install Linux runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsndfile1

      - name: Install Node dependencies
        run: npm ci

      - name: Create workspace venv (the UI tests' fixture scan runs .venv/bin/python)
        run: |
          python -m venv .venv
          ./.venv/bin/pip install --upgrade pip
          ./.venv/bin/pip install -c python-backend/constraints.txt -e ".[dev]"

      - name: Restore Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        run: npm run test:ui:install

      - name: Run UI smoke
        run: npm run test:ui
        env:
          # A test that needs the backend fails here instead of skipping.
          AWA_REQUIRE_BACKEND: '1'

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/

  e2e:
    name: e2e (VS Code extension host)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            python-backend/constraints.txt
            pyproject.toml

      - name: Install Linux + xvfb dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2t64 \
            libatk-bridge2.0-0 \
            libatk1.0-0 \
            libcups2 \
            libdrm2 \
            libgbm1 \
            libgtk-3-0 \
            libnspr4 \
            libnss3 \
            libsndfile1 \
            libxrandr2 \
            libxshmfence1 \
            libxss1 \
            xauth \
            xdotool \
            xvfb

      - name: Install Node dependencies
        run: npm ci

      - name: Create workspace venv (E2E expects .venv/bin/python)
        run: |
          python -m venv .venv
          ./.venv/bin/pip install --upgrade pip
          ./.venv/bin/pip install -c python-backend/constraints.txt -e ".[dev]"

      - name: Restore the pinned VS Code download
        uses: actions/cache@v6
        with:
          path: .vscode-test
          # runnerHelpers.ts pins the VS Code version; the E2E user data lives in a temporary directory.
          key: vscode-test-${{ runner.os }}-${{ hashFiles('src/e2e/runnerHelpers.ts') }}

      - name: Run E2E
        run: npm run verify:e2e

  browser-parity:
    name: Static Worker/native parity (headless)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            python-backend/constraints.txt
            pyproject.toml
      - run: npm ci
      - run: python3 -m venv .venv && .venv/bin/pip install -c python-backend/constraints.txt -e ".[dev]"
      - name: Restore Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm run test:ui:install
      - name: Restore hash-locked browser runtime downloads
        uses: actions/cache@v6
        with:
          path: browser-dist/runtime
          # Exact key only: a partial restore could publish assets the lock no longer lists.
          key: browser-runtime-${{ hashFiles('runtime/lock.json', 'runtime/licenses/**', 'scripts/prepare-browser-runtime.py') }}
      - run: npm run prepare:browser
      # Only the browser-specific half of `AWA_VERIFY_BROWSER=1 npm run verify`; the verify job runs the rest.
      - run: python3 scripts/prepare-browser-runtime.py --check
      - run: npm run test:browser
