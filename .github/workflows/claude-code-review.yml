name: Claude Code Review

# Automatic Claude Code review when a PR is opened (or leaves draft).
# For a re-review after new commits, comment "@claude review" (see claude.yml).
# Auth and App setup: see the header of claude.yml.

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Check credentials
        id: auth
        env:
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$OAUTH$API_KEY" ]; then
            echo "::notice::CLAUDE_CODE_OAUTH_TOKEN / ANTHROPIC_API_KEY is not set; skipping Claude review."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.auth.outputs.ok == 'true'
        with:
          fetch-depth: 1

      # Lets the reviewer compile, run tests and probe scripts to confirm what it reports.
      - uses: actions/setup-node@v5
        if: steps.auth.outputs.ok == 'true'
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-python@v6
        if: steps.auth.outputs.ok == 'true'
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            python-backend/requirements.txt
            pyproject.toml

      - name: Install dependencies
        if: steps.auth.outputs.ok == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsndfile1
          npm ci
          pip install -e ".[dev]"

      - uses: anthropics/claude-code-action@v1
        if: steps.auth.outputs.ok == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request by following .claude/review.md.
            The PR branch is checked out in the current working directory and
            its Node and Python dependencies are installed.
          claude_args: |
            --model opus
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(npm run verify),Bash(npm run compile:*),Bash(node:*),Bash(python:*),Read,Write,Grep,Glob"
